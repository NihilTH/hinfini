name: PHP MySQL checks and cPanel package
on:
  push:
    branches: [main, 'codex/php-mysql']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php-api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: hinfini_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_NAME: hinfini_test
      DB_USER: root
      DB_PASSWORD: test-only-password
      ADMIN_TOKEN: integration-test-admin-token-not-production
      EMAIL_PROVIDER: none
      ORDER_NOTIFY_EMAIL: admin@example.test
      SIMPLEPAY_SECRET_KEY: integration-test-signing-key-not-production
      SIMPLEPAY_MERCHANT_ID: TESTMERCHANT
      PUBLIC_SITE_URL: http://127.0.0.1:8001
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, curl, mbstring, fileinfo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: find backend-php deploy -name '*.php' -exec php -l {} \;
      - run: php backend-php/tests/mail-template.php
      - run: php backend-php/bin/console.php migrate
      - run: php backend-php/bin/console.php seed
      - run: node backend-php/tests/integration.mjs
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: yarn install --frozen-lockfile
        working-directory: frontend
      - run: yarn test --watchAll=false --runInBand
        working-directory: frontend
        env:
          CI: true
      - run: yarn build
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ''
          GENERATE_SOURCEMAP: 'false'
          CI: 'false'
      - run: node scripts/package-cpanel.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hinfini-cpanel-php-mysql
          path: release/
          include-hidden-files: true

      - uses: actions/upload-artifact@v4
        with:
          name: hinfini-webshop-frissites
          path: release-update/
